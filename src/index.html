<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Looper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Video Looper</h1>
        
        <!-- File selection area -->
        <div class="section">
            <h3>Select Video Files</h3>
            <!-- Single browse button - can select one or multiple files -->
            <button id="selectFiles">Browse Files</button>
            <div id="fileList"></div>
        </div>

        <!-- Target duration input -->
        <div class="section">
            <h3>Target Duration</h3>
            <input type="number" id="targetHours" value="10" min="0.01" max="100" step="0.01">
            <label>hours</label>
        </div>

        <!-- Output section (shown after file selection) -->
        <div class="section" id="outputSection" style="display:none;">
            <h3>Output</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="outputPath" readonly style="flex: 1; padding: 8px; background: #f5f5f5;">
                <button id="changeOutputBtn">Change</button>
            </div>
            <div id="outputInfo" style="margin-top: 10px; color: #666; font-size: 14px;"></div>
        </div>

        <!-- Random order checkbox (only shown when multiple files selected) -->
        <div class="section" id="randomSection" style="display:none;">
            <label>
                <input type="checkbox" id="randomOrder"> Randomize clip order
            </label>
        </div>

        <!-- Start button -->
        <button id="startBtn" class="primary-btn">Start Processing</button>

        <!-- Progress section (hidden initially) -->
        <div id="progressSection" style="display:none;">
            <h3>Progress</h3>
            <div class="progress-item">
                <span>Step 1: Creating video</span>
                <progress id="progress1" max="100" value="0"></progress>
                <span id="progress1Text">0%</span>
            </div>
            <div class="progress-item">
                <span>Step 2: Optimizing for fast playback</span>
                <div style="text-align: center; padding: 20px; font-size: 18px; color: #666;">
                    <span class="spinner">⟳</span> 
                    <span id="timeRemaining" style="margin-left: 10px;">Waiting...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
